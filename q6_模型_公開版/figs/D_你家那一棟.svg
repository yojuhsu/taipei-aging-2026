<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350"><rect width="960" height="350" fill="#fffdf8"/><text x="32.0" y="52.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="28" font-weight="900" fill="#1a1a1a" text-anchor="start">你家那一棟，開放資料看到哪一層</text><rect x="32.0" y="80.0" width="213.5" height="210.0" rx="10" fill="#f3f1ec"/><text x="50.0" y="116.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#666666" text-anchor="start">棟</text><text x="50.0" y="154.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="30" font-weight="900" fill="#1a1a1a" text-anchor="start">222,459</text><text x="50.0" y="204.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="19" font-weight="900" fill="#1a1a1a" text-anchor="start">棟的使照年份、</text><text x="50.0" y="230.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="19" font-weight="900" fill="#1a1a1a" text-anchor="start">構造、海砂屋列管，</text><text x="50.0" y="256.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="19" font-weight="900" fill="#1a1a1a" text-anchor="start">在市府的登記資料裡</text><rect x="259.5" y="80.0" width="213.5" height="210.0" rx="10" fill="#f3f1ec"/><text x="277.5" y="116.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#666666" text-anchor="start">里</text><text x="277.5" y="154.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="30" font-weight="900" fill="#1a1a1a" text-anchor="start">456</text><text x="277.5" y="197.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">老人幾人、</text><text x="277.5" y="216.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">住老公寓的幾人、</text><text x="277.5" y="235.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">獨居幾人、所得中位</text><text x="277.5" y="265.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="18" font-weight="900" fill="#1a1a1a" text-anchor="start">開放</text><rect x="487.0" y="80.0" width="213.5" height="210.0" rx="10" fill="#f3f1ec"/><text x="505.0" y="116.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#666666" text-anchor="start">最小統計區</text><text x="505.0" y="154.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="30" font-weight="900" fill="#1a1a1a" text-anchor="start">11,490</text><text x="505.0" y="197.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">人口與年齡。</text><text x="505.0" y="216.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">銀髮安居也有統計區版，</text><text x="505.0" y="235.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">本頁沒有使用</text><text x="505.0" y="265.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="18" font-weight="900" fill="#1a1a1a" text-anchor="start">開放</text><rect x="714.5" y="80.0" width="213.5" height="210.0" rx="10" fill="#f3f1ec"/><text x="732.5" y="116.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#666666" text-anchor="start">鄰</text><text x="732.5" y="154.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="30" font-weight="900" fill="#1a1a1a" text-anchor="start">9,693</text><text x="732.5" y="197.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">只有邊界：液化、窄巷、</text><text x="732.5" y="216.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">消防栓疊得上去，</text><text x="732.5" y="235.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">人口沒有</text><text x="732.5" y="265.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="18" font-weight="900" fill="#1a1a1a" text-anchor="start">開放</text><text x="32.0" y="318.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">地：液化潛勢圖、鄰界圖、窄巷清冊、消防栓。屋：稅籍屋齡（區）、銀髮安居（里）、實價登錄成交（巷段）。</text><text x="32.0" y="334.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">人：民政局年齡、綜所稅、銀髮安居（里）、五歲年齡組人口（最小統計區）。申請：危老與都更核准到地籍小段。</text></svg>