<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356"><rect width="960" height="356" fill="#fffdf8"/><text x="32.0" y="52.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="28" font-weight="900" fill="#1a1a1a" text-anchor="start">市場去了哪裡</text><rect x="32.0" y="80.0" width="289.3" height="200.0" rx="10" fill="#f3f1ec" stroke="#C8102E" stroke-width="2"/><text x="50.0" y="116.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="22" font-weight="900" fill="#1a1a1a" text-anchor="start">33 個里</text><text x="50.0" y="159.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">地會液化、老公寓老人多。</text><text x="50.0" y="178.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">住了 47,052 位老人，</text><text x="50.0" y="197.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">22,119 位住老公寓。</text><text x="50.0" y="231.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="22" font-weight="900" fill="#C8102E" text-anchor="start">危老核准 34 件</text><text x="50.0" y="258.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">都更核定 27 件</text><rect x="335.3" y="80.0" width="289.3" height="200.0" rx="10" fill="#f3f1ec"/><text x="353.3" y="116.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="22" font-weight="900" fill="#1a1a1a" text-anchor="start">其他 423 個里</text><text x="353.3" y="159.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">住了 554,185 位老人，</text><text x="353.3" y="178.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">131,706 位住老公寓。</text><text x="353.3" y="212.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="22" font-weight="900" fill="#1a1a1a" text-anchor="start">危老核准 1,022 件</text><text x="353.3" y="239.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">都更核定 725 件</text><rect x="638.7" y="80.0" width="289.3" height="200.0" rx="10" fill="#f3f1ec"/><text x="656.7" y="166.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="19" font-weight="900" fill="#1a1a1a" text-anchor="start">民辦跟著動機走，</text><text x="656.7" y="192.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="19" font-weight="900" fill="#1a1a1a" text-anchor="start">本來就會；</text><text x="656.7" y="218.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="19" font-weight="900" fill="#1a1a1a" text-anchor="start">公辦都更，</text><text x="656.7" y="244.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="19" font-weight="900" fill="#1a1a1a" text-anchor="start">從這 33 個里起算</text><text x="32.0" y="308.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">件數是按地籍小段比例分到里的量，不是逐案；一件幾戶，資料裡沒有。危老 1,056 件（都發局，至 2026 年 2 月）、都更 754 件（都發局一覽表去重，</text><text x="32.0" y="324.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">至 2026 年 10 月 15 日）。</text><text x="32.0" y="340.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">核准少的原因資料分不開（市場、產權、基地、容積）。老人數：民政局 2026 年 9 月；住老公寓：銀髮安居 113 年。</text></svg>