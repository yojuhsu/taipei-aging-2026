 34 Z" fill="#c9c9c9"/></g><g transform="translate(593.8,98.0) scale(1.305)"><circle cx="12" cy="7" r="6" fill="#c9c9c9"/><path d="M1 34 Q1 16 12 16 Q23 16 23 34 Z" fill="#c9c9c9"/></g><g transform="translate(638.1,98.0) scale(1.305)"><circle cx="12" cy="7" r="6" fill="#c9c9c9"/><path d="M1 34 Q1 16 12 16 Q23 16 23 34 Z" fill="#c9c9c9"/></g><text x="505.0" y="194.4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="19" font-weight="900" fill="#1a1a1a" text-anchor="start">每 4 個臺北人，</text><text x="505.0" y="220.4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="19" font-weight="900" fill="#1a1a1a" text-anchor="start">1 個 65 歲以上</text><text x="505.0" y="251.4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">戶籍 2,418,872 人，</text><text x="505.0" y="270.4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">65 歲以上 601,237 人。</text><text x="505.0" y="360.4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="10" font-weight="400" fill="#666666" text-anchor="start">民政局，2026 年 9 月</text><rect x="714.5" y="80.0" width="213.5" height="294.4" rx="10" fill="#f3f1ec"/><g transform="translate(732.5,98.0) scale(0.522)"><circle cx="12" cy="7" r="6" fill="#1a1a1a"/><path d="M1 34 Q1 16 12 16 Q23 16 23 34 Z" fill="#1a1a1a"/></g><g transform="translate(750.2,98.0) scale(0.522)"><circle cx="12" cy="7" r="6" fill="#1a1a1a"/><path d="M1 34 Q1 16 12 16 Q23 16 23 34 Z" fill="#1a1a1a"/></g><g transform="translate(768.0,98.0) scale(0.522)"><circle cx="12" cy="7" r="6" fill="#1a1a1a"/><path d="M1 34 Q1 16 12 16 Q23 16 23 34 Z" fill="#1a1a1a"/></g><g transform="translate(785.8,98.0) scale(0.522)"><circle cx="12" cy="7" r="6" fill="#c9c9c9"/><path d="M1 34 Q1 16 12 16 Q23 16 23 34 Z" fill="#c9c9c9"/></g><g transform="translate(803.5,98.0) scale(0.522)"><circle cx="12" cy="7" r="6" fill="#c9c9c9"/><path d="M1 