<svg xmlns="http://www.w3.org/2000/svg" width="960" height="434" viewBox="0 0 960 434"><rect width="960" height="434" fill="#fffdf8"/><text x="32.0" y="52.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="28" font-weight="900" fill="#1a1a1a" text-anchor="start">臺北的房子老了，住在裡面的人也老了</text><rect x="32.0" y="80.0" width="213.5" height="294.4" rx="10" fill="#f3f1ec"/><g transform="translate(50.0,98.0) scale(1.305)"><path d="M2 14 L16 2 L30 14 L30 32 L2 32 Z" fill="#1a1a1a"/><rect x="12" y="20" width="8" height="12" fill="#fffdf8"/></g><g transform="translate(94.4,98.0) scale(1.305)"><path d="M2 14 L16 2 L30 14 L30 32 L2 32 Z" fill="#1a1a1a"/><rect x="12" y="20" width="8" height="12" fill="#fffdf8"/></g><g transform="translate(138.8,98.0) scale(1.305)"><path d="M2 14 L16 2 L30 14 L30 32 L2 32 Z" fill="#1a1a1a"/><rect x="12" y="20" width="8" height="12" fill="#fffdf8"/></g><g transform="translate(183.1,98.0) scale(1.305)"><path d="M2 14 L16 2 L30 14 L30 32 L2 32 Z" fill="#c9c9c9"/><rect x="12" y="20" width="8" height="12" fill="#fffdf8"/></g><text x="50.0" y="194.4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="19" font-weight="900" fill="#1a1a1a" text-anchor="start">每 4 間住宅，</text><text x="50.0" y="220.4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="19" font-weight="900" fill="#1a1a1a" text-anchor="start">3 間超過 30 年</text><text x="50.0" y="251.4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">全市 917,280 宅，</text><text x="50.0" y="270.4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">672,607 宅超過 30 年，</text><text x="50.0" y="289.4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">188,584 宅超過 50 年。</text><text x="50.0" y="360.4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="10" font-weight="400" fill="#666666" text-anchor="start">國土管理署房屋稅籍，114 年第 4 季</text><rect x="259.5" y="80.0" width="213.5" height="294.4" rx="10" fill="#f3f1ec"/><g transform="translate(277.5,98.0) scale(0.522)"><rect x="4" y="2" width="20" height="30" fill="#1a1a1a"/><rect x="8" y="6" width="4" height="4" fill="#fffdf8"/><rect x="16" y="6" width="4" height="4" fill="#fffdf8"/><rect x="8" y="13" width="4" height="4" fill="#fffdf8"/><rect x="16" y="13" width="4" height="4" fill="#fffdf8"/><rect x="8" y="20" width="4" height="4" fill="#fffdf8"/><rect x="16" y="20" width="4" height="4" fill="#fffdf8"/></g><g transform="translate(295.2,98.0) scale(0.522)"><rect x="4" y="2" width="20" height="30" fill="#1a1a1a"/><rect x="8" y="6" width="4" height="4" fill="#fffdf8"/><rect x="16" y="6" width="4" height="4" fill="#fffdf8"/><rect x="8" y="13" width="4" height="4" fill="#fffdf8"/><rect x="16" y="13" width="4" height="4" fill="#fffdf8"/><rect x="8" y="20" width="4" height="4" fill="#fffdf8"/><rect x="16" y="20" width="4" height="4" fill="#fffdf8"/></g><g transform="translate(313.0,98.0) scale(0.522)"><rect x="4" y="2" width="20" height="30" fill="#1a1a1a"/><rect x="8" y="6" width="4" height="4" fill="#fffdf8"/><rect x="16" y="6" width="4" height="4" fill="#fffdf8"/><rect x="8" y="13" width="4" height="4" fill="#fffdf8"/><rect x="16" y="13" width="4" height="4" fill="#fffdf8"/><rect x="8" y="20" width="4" height="4" fill="#fffdf8"/><rect x="16" y="20" width="4" height="4" fill="#fffdf8"/></g><g transform="translate(330.8,98.0) scale(0.522)"><rect x="4" y="2" width="20" height="30" fill="#1a1a1a"/><rect x="8" y="6" width="4" height="4" fill="#fffdf8"/><rect x="16" y="6" width="4" height="4" fill="#fffdf8"/><rect x="8" y="13" width="4" height="4" fill="#fffdf8"/><rect x="16" y="13" width="4" height="4" fill="#fffdf8"/><rect x="8" y="20" width="4" height="4" fill="#fffdf8"/><rect x="16" y="20" width="4" height="4" fill="#fffdf8"/></g><g transform="translate(348.5,98.0) scale(0.522)"><rec