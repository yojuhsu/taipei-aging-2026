><text x="732.5" y="360.4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="10" font-weight="400" fill="#666666" text-anchor="start">內政部銀髮安居，113 年</text><text x="32.0" y="402.4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">棟是改建的單位，宅是住的單位，兩個分母範圍不同，不互除。</text><text x="32.0" y="418.4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">各格是不同機關、不同時間點的統計，每一格只跟自己的分母比。</text></svg>